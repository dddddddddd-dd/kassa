{% extends 'base.html' %}
{% load static %}

{% block title %}Вход — Тетрадь продаж{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M2 12h20"/>
                </svg>
            </div>
            <h1 class="login-title">Тетрадь продаж</h1>
            <p class="login-subtitle">Аптечный учёт продаж</p>
        </div>

        {% if error_message %}
            <div class="alert-error" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error_message }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="login-form" autocomplete="on">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="form-group">
                <label for="id_username" class="form-label">Логин</label>
                <div class="input-wrapper">
                    <input type="text" 
                           name="username" 
                           id="id_username" 
                           class="form-input" 
                           placeholder="Введите логин" 
                           required 
                           autofocus 
                           autocapitalize="none">
                </div>
            </div>

            <div class="form-group">
                <label for="id_password" class="form-label">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" 
                           name="password" 
                           id="id_password" 
                           class="form-input" 
                           placeholder="••••••••" 
                           required>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-login">
                <span>Войти</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="login-footer">
            <span class="security-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Защищённый вход
            </span>
        </div>
    </div>
</div>
{% endblock %}
